<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp Dashboard</title>

<style>

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background:#f0f2f5;
}

/* LOGIN SCREEN */

#login{
  display:flex;
  height:100vh;
  justify-content:center;
  align-items:center;
}

#loginBox{
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input{
  padding:10px;
  width:250px;
  margin-top:10px;
}

button{
  padding:10px;
  margin-top:10px;
  width:100%;
  background:#25d366;
  border:none;
  color:white;
  cursor:pointer;
}

/* MAIN UI */

#app{
  display:none;
  height:100vh;
}

/* LEFT PANEL */

#left{
  width:30%;
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
}

.contact{
  padding:15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.contact:hover{
  background:#f5f5f5;
}

.name{
  font-weight:600;
}

.time{
  font-size:12px;
  color:gray;
}

.greenDot{
  width:10px;
  height:10px;
  background:#25d366;
  border-radius:50%;
}

/* RIGHT PANEL */

#right{
  width:70%;
  display:flex;
  flex-direction:column;
}

#chatHeader{
  background:white;
  padding:15px;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

#chat{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  margin:10px 0;
  max-width:60%;
  padding:10px;
  border-radius:10px;
}

.sent{
  background:#dcf8c6;
  margin-left:auto;
}

.received{
  background:white;
}

.msgTime{
  font-size:11px;
  color:gray;
}

/* INPUT */

#inputBox{
  display:flex;
  padding:10px;
  background:white;
}

#message{
  flex:1;
}

#loading{
  padding:10px;
  text-align:center;
  color:gray;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div id="loginBox">

    <h3>Login</h3>

    <input id="password" type="password" placeholder="Enter password">

    <button onclick="login()">Login</button>

    <div id="loginError"></div>

  </div>

</div>


<!-- APP -->

<div id="app">

  <div id="left"></div>

  <div id="right">

    <div id="chatHeader">Select chat</div>

    <div id="chat"></div>

    <div id="loading"></div>

    <div id="inputBox">

      <input id="message" placeholder="Type message">

      <button onclick="send()">Send</button>

    </div>

  </div>

</div>


<script>

const PASSWORD = "tatva"; // change this
const API = "https://script.google.com/macros/s/AKfycbxh0Fi6Yq2NAFwUq4d9J-e4Rig8v4BLvaPJW42MHCcEDMlotMJJmqHDTQVh4PH9MiNl/exec";
const KEY = "mysecret123";

let selectedPhone = "";


/* LOGIN */

function login(){

  if(document.getElementById("password").value === PASSWORD){

    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="flex";

    loadContacts();

  }
  else{

    document.getElementById("loginError").innerText="Wrong password";

  }

}


/* LOADING */

function showLoading(text){

  document.getElementById("loading").innerText=text;

}

function hideLoading(){

  document.getElementById("loading").innerText="";

}


/* LOAD CONTACTS */

async function loadContacts(){

  showLoading("Loading contacts...");

  const res = await fetch(API+"?key="+KEY+"&action=getContacts");

  const data = await res.json();

  const left = document.getElementById("left");

  left.innerHTML="";

  data.forEach(c=>{

    const div=document.createElement("div");

    div.className="contact";

    const name=c.name || c.phone;

    const time=new Date(c.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    div.innerHTML=`
      <div>
        <div class="name">${name}</div>
        <div class="time">${c.lastMessage}</div>
      </div>
      <div>
        <div class="time">${time}</div>
        ${c.unread ? '<div class="greenDot"></div>' : ''}
      </div>
    `;

    div.onclick=()=>loadChat(c.phone,name);

    left.appendChild(div);

  });

  hideLoading();

}


/* LOAD CHAT */

async function loadChat(phone,name){

  selectedPhone=phone;

  document.getElementById("chatHeader").innerText=name;

  showLoading("Loading chat...");

  const res = await fetch(API+"?key="+KEY+"&action=getChat&phone="+phone);

  const data = await res.json();

  const chat=document.getElementById("chat");

  chat.innerHTML="";

  data.forEach(m=>{

    const div=document.createElement("div");

    div.className="msg "+m.type;

    const time=new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    div.innerHTML=`
      ${m.message}
      <div class="msgTime">${time}</div>
    `;

    chat.appendChild(div);

  });

  chat.scrollTop=chat.scrollHeight;

  hideLoading();

}


/* SEND MESSAGE */

async function send(){

  const text=document.getElementById("message").value;

  if(!text)return;

  await fetch(API+"?key="+KEY,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      phone:selectedPhone,
      message:text
    })
  });

  document.getElementById("message").value="";

  loadChat(selectedPhone,document.getElementById("chatHeader").innerText);

}

</script>

</body>
</html>
