<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp Dashboard</title>

<style>

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background:#f0f2f5;
}

/* LOGIN */

#login{
  display:flex;
  height:100vh;
  justify-content:center;
  align-items:center;
}

#loginBox{
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

input{
  padding:12px;
  width:260px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  padding:12px;
  margin-top:10px;
  width:100%;
  background:#25d366;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
  font-weight:600;
}

/* APP */

#app{
  display:none;
  height:100vh;
}

/* LEFT PANEL */

#left{
  width:30%;
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
}

.contact{
  padding:15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  transition:background 0.2s;
}

.contact:hover{
  background:#f5f5f5;
}

.name{
  font-weight:600;
}

.time{
  font-size:12px;
  color:gray;
}

.greenDot{
  width:10px;
  height:10px;
  background:#25d366;
  border-radius:50%;
  margin-top:4px;
}

/* RIGHT PANEL */

#right{
  width:70%;
  display:flex;
  flex-direction:column;
}

#chatHeader{
  background:white;
  padding:15px;
  border-bottom:1px solid #ddd;
  font-weight:600;
  position:sticky;
  top:0;
}

#chat{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  margin:10px 0;
  max-width:60%;
  padding:10px;
  border-radius:10px;
  animation:fadeIn 0.15s ease;
}

.sent{
  background:#dcf8c6;
  margin-left:auto;
}

.received{
  background:white;
}

.msgTime{
  font-size:11px;
  color:gray;
  margin-top:3px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}

/* INPUT */

#inputBox{
  display:flex;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

#message{
  flex:1;
}

#loading{
  position:absolute;
  top:10px;
  right:10px;
}

/* LOADER */

.loader {
  border:4px solid #eee;
  border-top:4px solid #25d366;
  border-radius:50%;
  width:18px;
  height:18px;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div id="loginBox">

    <h3>WhatsApp Login</h3>

    <input id="password" type="password" placeholder="Enter password">

    <button onclick="login()">Login</button>

    <div id="loginError" style="color:red;margin-top:10px;"></div>

  </div>

</div>


<!-- APP -->

<div id="app">

  <div id="left"></div>

  <div id="right">

    <div id="chatHeader">Select chat</div>

    <div id="chat"></div>

    <div id="inputBox">

      <input id="message" placeholder="Type message">

      <button onclick="send()">Send</button>

    </div>

  </div>

</div>

<div id="loading"></div>

<script>

const 1 = "tatva";
const API = "https://script.google.com/macros/s/AKfycbyqmHw7ovYjlK-CgkUW51ybqVvCJK3cgdwt6qJ9jBGrw2QNWeSRiq4UCdK1P4WtrRsU/exec";
const KEY = "ak_secure_chat_2026";

let selectedPhone="";
let lastContactsHash="";

/* LOGIN */

function login(){

  if(password.value===PASSWORD){

    login.style.display="none";
    app.style.display="flex";

    loadContacts();

    setTimeout(()=>message.focus(),200);

  }
  else{

    loginError.innerText="Wrong password";

  }

}

/* LOADING */

function showLoading(){

  loading.innerHTML='<div class="loader"></div>';

}

function hideLoading(){

  loading.innerHTML='';

}

/* CONTACT RENDER */

function renderContacts(data){

  left.innerHTML="";

  data.forEach(c=>{

    const div=document.createElement("div");

    div.className="contact";

    const name=c.name||c.phone;

    const time=new Date(c.time).toLocaleTimeString([],{
      hour:'2-digit',
      minute:'2-digit'
    });

    div.innerHTML=`
      <div>
        <div class="name">${name}</div>
        <div class="time">${c.lastMessage}</div>
      </div>
      <div>
        <div class="time">${time}</div>
        ${c.unread?'<div class="greenDot"></div>':''}
      </div>
    `;

    div.onclick=()=>loadChat(c.phone,name);

    left.appendChild(div);

  });

}

/* LOAD CONTACTS */

async function loadContacts(){

  showLoading();

  const res=await fetch(API+"?key="+KEY+"&action=getContacts");

  const data=await res.json();

  renderContacts(data);

  lastContactsHash=JSON.stringify(data);

  hideLoading();

}

/* LOAD CHAT */

async function loadChat(phone,name){

  selectedPhone=phone;

  chatHeader.innerText=name;

  const res=await fetch(API+"?key="+KEY+"&action=getChat&phone="+phone);

  const data=await res.json();

  chat.innerHTML="";

  data.forEach(m=>{

    const div=document.createElement("div");

    div.className="msg "+m.type;

    const time=new Date(m.time).toLocaleTimeString([],{
      hour:'2-digit',
      minute:'2-digit'
    });

    div.innerHTML=`
      ${m.message}
      <div class="msgTime">${time}</div>
    `;

    chat.appendChild(div);

  });

  chat.scrollTop=chat.scrollHeight;

}

/* SEND */

async function send(){

  const text=message.value.trim();

  if(!text||!selectedPhone)return;

  message.value="";
  message.disabled=true;

  await fetch(API+"?key="+KEY,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      phone:selectedPhone,
      message:text
    })
  });

  message.disabled=false;
  message.focus();

  loadChat(selectedPhone,chatHeader.innerText);

}

/* ENTER KEY */

message.addEventListener("keypress",function(e){

  if(e.key==="Enter")send();

});

/* REALTIME UPDATE */

setInterval(async()=>{

  try{

    const res=await fetch(API+"?key="+KEY+"&action=getContacts");

    const data=await res.json();

    const hash=JSON.stringify(data);

    if(hash!==lastContactsHash){

      renderContacts(data);

      lastContactsHash=hash;

    }

    if(selectedPhone){

      loadChat(selectedPhone,chatHeader.innerText);

    }

  }catch(e){}

},2000);

</script>

</body>
</html>
