<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Chat UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
    }

    #left {
      width: 30%;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #right {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    .contact {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .contact:hover {
      background: #f5f5f5;
    }

    #chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .msg {
      margin: 5px 0;
    }

    .sent {
      text-align: right;
      color: green;
    }

    .received {
      text-align: left;
      color: blue;
    }

    #inputBox {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #inputBox input {
      flex: 1;
      padding: 10px;
    }

    #inputBox button {
      padding: 10px;
    }
  </style>
</head>
<body>

<div id="left"></div>

<div id="right">
  <div id="chat"></div>

  <div id="inputBox">
    <input id="message" placeholder="Type message">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

let selectedPhone = ""

const API = "https://script.google.com/macros/s/AKfycbxTy0kTJBKnPwkQR-09U8bAFFU4nieqcosI2OQIiaaxdDPd5kSUCPOq-gEXW5y8wtkL/exec"

async function loadContacts() {

  const res = await fetch(API + "?action=getContacts")
  const data = await res.json()

  const left = document.getElementById("left")
  left.innerHTML = ""

  data.forEach(c => {

    const div = document.createElement("div")
    div.className = "contact"
    div.innerText = c.phone

    div.onclick = () => loadChat(c.phone)

    left.appendChild(div)
  })
}

async function loadChat(phone) {

  selectedPhone = phone

  const res = await fetch(API + "?action=getChat&phone=" + phone)
  const data = await res.json()

  const chat = document.getElementById("chat")
  chat.innerHTML = ""

  data.forEach(m => {

    const div = document.createElement("div")

    div.className = "msg " + (m.type === "sent" ? "sent" : "received")

    div.innerText = m.message

    chat.appendChild(div)
  })
}

async function send() {

  const msg = document.getElementById("message").value

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      phone: selectedPhone,
      message: msg
    })
  })

  loadChat(selectedPhone)
}

loadContacts()

</script>

</body>
</html>
